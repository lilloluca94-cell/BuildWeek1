<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Question</title>
</head>

<body>

    <header>
        <div id="logo">
            <img src="./assets/img/epicode_logo.png" alt="logo logo Epicode">
        </div>
        <div id="timer-container">
            <svg class="timer-svg" width="130" height="130" viewBox="0 0 130 130">
                <circle class="timer-bg" cx="65" cy="65" r="54" />
                <circle class="timer-progress" id="timer-circle" cx="65" cy="65" r="54" />
                </svg>
            <div class="timer-text">
                <span class="timer-label">SECONDS</span>
                <span id="timer-number">30</span>
                <span class="timer-label">REMAINING</span>
            </div>
        </div>
    </header>

    <main>
        <div id="mainpage">

            <div id="question">

            </div>

            <div id="answer">

            </div>



            <div id="bottom">
                <div id="countquestion">
                </div>
            </div>

        </div>

    </main>



    <script src="./assets/javascript/script.js"></script>
</body>

</html>
